<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Encryptor — Tools &amp; Stego Lab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="bgGridLayer" class="bg-grid-layer" aria-hidden="true"></div>
  <div id="ambientLight" class="ambient-light" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-meta">
          <div class="brand-name-row">
            <h1>Cipher Tools</h1>
            <span class="badge-subtle">Stego &amp; Verifier</span>
          </div>
          <p class="brand-sub">Utilitas kriptografi lokal tanpa server</p>
        </div>
      </div>
    </header>

    <main class="studio-grid">
      <!-- 1. Zero-Width Text Steganography -->
      <section class="surface-card">
        <div class="card-head">
          <h2>Zero-Width Text Stego</h2>
          <span class="mono-tag">ChaCha20 &rarr; Unicode</span>
        </div>

        <div class="form-stack">
          <div class="field">
            <label style="font-size:0.78rem;color:var(--text-secondary);">Kalimat Pengantar (Tampil Normal di Chat)</label>
            <input type="text" id="zwCarrierInput" class="sub-input" value="Halo, berkasnya sudah aku kirim ya." />
          </div>
          <div class="field">
            <label style="font-size:0.78rem;color:var(--text-secondary);">Pesan Rahasia / Teks Hasil Stego</label>
            <textarea id="zwMessageInput" class="tool-textarea" placeholder="Ketik pesan rahasia untuk disembunyikan, atau tempel teks stego untuk dibaca..."></textarea>
          </div>
          <div class="field">
            <label style="font-size:0.78rem;color:var(--text-secondary);">Password Stego Teks</label>
            <input type="password" id="zwPasswordInput" class="sub-input" placeholder="Password enkripsi teks..." />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-primary" id="btnZwHide">Sembunyikan</button>
            <button type="button" class="btn-secondary" id="btnZwReveal">Ekstrak Pesan</button>
          </div>
          <div id="zwOutputBox" class="hash-output" style="display:none;"></div>
          <button type="button" class="btn-ghost-sm" id="btnZwCopy" style="display:none;">Salin Hasil ke Clipboard</button>
        </div>
      </section>

      <!-- 2. SHA-256 Verifier & Standalone Inspector -->
      <section class="surface-card">
        <div class="card-head">
          <h2>SHA-256 Verifier &amp; Inspector</h2>
          <span class="mono-tag">Forensic Check</span>
        </div>

        <div class="form-stack">
          <div class="file-pick-row">
            <button type="button" class="btn-ghost-sm" id="btnPickHashFile">Pilih File</button>
            <span class="pick-label" id="hashFileLabel">Pilih file apa saja atau .cel</span>
            <input type="file" id="hashFileInput" style="display:none;" />
          </div>

          <div id="hashResultBox" class="hash-output" style="display:none;"></div>

          <div class="field">
            <label style="font-size:0.78rem;color:var(--text-secondary);">Bandingkan dengan Hash SHA-256 Pembanding (Opsional)</label>
            <input type="text" id="hashCompareInput" class="sub-input" placeholder="Tempel 64 karakter hex SHA-256 di sini..." />
          </div>
          <div id="hashMatchStatus" style="font-size:0.78rem;font-weight:600;"></div>

          <div id="standaloneInspectBox" class="form-stack" style="display:none;"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

</body>
